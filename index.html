                    : '<div class="empty-message">No one here yet</div>'
                }
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('timers-container').innerHTML = timerHTML;
            startGlobalTick();
            globalTick(); // paint immediately so counts aren't blank until the next tick
            updateNextLineInfo();
        }

        // Persistent per-line alarm state (survives re-renders — THIS is the alarm-reliability fix).
        const alarmFired = {};   // lineId -> last interval index we already rang for
        const warned30 = {};     // lineId -> upcoming interval index we already 30s-warned for
        let _globalTickStarted = false;
        let _globalTickId = null;

        function startGlobalTick() {
            if (_globalTickStarted) return;
            _globalTickStarted = true;
            _globalTickId = setInterval(globalTick, 200);
        }

        function tickOneLine(config) {
            const line = config.id;
            let timer = null;
            try { timer = document.querySelector('.timer[data-line="' + CSS.escape(line) + '"]'); } catch (e) { timer = null; }
            if (!timer) return;
            const countElement = timer.querySelector('.count');
            if (!countElement) return;

            const startT = scheduledTimes[line];
            if (!startT) {
                // Not scheduled: clear any alarm state so a future schedule starts clean.
                alarmFired[line] = undefined;
                warned30[line] = undefined;
                return;
            }

            const now = Date.now();
            let status;

            if (now < startT) {
                // Waiting to start (or rescheduled to the future): reset alarm baseline.
                alarmFired[line] = undefined;
                warned30[line] = undefined;
                const timeUntilStart = startT - now;
                const minutesUntilStart = Math.floor(timeUntilStart / 60000);
                const displayMinutes = minutesUntilStart < 1 ? "< 1" : minutesUntilStart;
                countElement.innerHTML = `Starting in ${displayMinutes} min<br><span class="scheduled-time">${formatTime(new Date(startT))}</span>`;
                countElement.classList.add('starting-text');
                timer.classList.remove('finish-window');
                if (timeUntilStart <= BLINK_TIME_MIN * 60000) timer.classList.add('blinking');
                else timer.classList.remove('blinking');
                status = 'inactive';
            } else {
                countElement.classList.remove('starting-text');
                timer.classList.remove('blinking');
                const elapsed = now - startT;

                if (elapsed >= TOTAL_SESSION_TIME) {
                    countElement.textContent = "00:00";
                    timer.classList.remove('finish-window');
                    status = 'inactive';
                    alarmFired[line] = undefined;
                    warned30[line] = undefined;

                    // Auto-reschedule (writers only — viewers must never write).
                    if (currentRole !== 'viewer') {
                        const autoRescheduleValue = document.getElementById('autoReschedule').value;
                        if (autoRescheduleValue !== 'off') {
                            const nextStart = getNextFiveMinuteSlot(Date.now(), parseInt(autoRescheduleValue));
                            const newTimeStr = formatTime(new Date(nextStart));
                            scheduledTimes[line] = nextStart; // synchronous -> only one write fires
                            config.time = newTimeStr;
                            const timeSelect = document.getElementById(`time${line}`);
                            if (timeSelect) timeSelect.value = newTimeStr;
                            lineRef(line).update({ time: newTimeStr }).catch(handleWriteError);
                        } else {
                            delete scheduledTimes[line];
                            config.time = '';
                            const timeSelect = document.getElementById(`time${line}`);
                            if (timeSelect) timeSelect.value = '';
                            lineRef(line).update({ time: '' }).catch(handleWriteError);
                        }
                    }
                } else {
                    const remaining = TOTAL_SESSION_TIME - elapsed;
                    const mm = Math.floor(remaining / 60000);
                    const ss = Math.floor((remaining % 60000) / 1000);
                    if (remaining <= FINISH_WINDOW_MIN * 60000) {
                        countElement.textContent = "This line's time is over";
                        countElement.classList.add('lounge-text');
                        timer.classList.add('finish-window');
                    } else {
                        countElement.textContent = `${pad(mm)}:${pad(ss)}`;
                        countElement.classList.remove('lounge-text');
                        timer.classList.remove('finish-window');
                    }
                    status = 'active';

                    const currentInterval = Math.floor(elapsed / MS5);
                    // Baseline on first observation so we don't ring for interval 0 or past intervals.
                    if (alarmFired[line] === undefined) {
                        alarmFired[line] = currentInterval;
                    } else if (currentInterval > alarmFired[line]) {
                        // Rings on every open client (each venue screen). No isUpdatingUI guard, and
                        // we never advance without ringing, so churn can no longer swallow an alarm.
                        showChangeSeatNotification();
                        alarmFired[line] = currentInterval;
                    }

                    // 30-second warning: fire once for the upcoming interval when it is <=30s away.
                    // Robust to jitter/background throttling (no fragile 200ms window).
                    const timeUntilNextAlarm = MS5 - (elapsed % MS5);
                    if (timeUntilNextAlarm <= 30000) {
                        const upcoming = currentInterval + 1;
                        if (warned30[line] !== upcoming) {
                            warned30[line] = upcoming;
                            showThirtySecondAlarm();
                        }
                    }
                }
            }
            timer.classList.toggle('active', status === 'active');
            timer.classList.toggle('inactive', status === 'inactive');
        }

        function globalTick() {
            for (let i = 0; i < lineConfigs.length; i++) {
                try { tickOneLine(lineConfigs[i]); } catch (e) { console.error('tick error:', e); }
            }
        }

        function addPerson(lineId) {
            if (currentRole === 'viewer') return;

            const config = lineConfigs.find(c => c.id === lineId);
            if (!config) return;

            const input = document.getElementById(`newPerson${lineId}`);
            const name = input.value.trim();
            if (!name) return;

            // Best-effort capacity guard (soft UI limit). We deliberately DO NOT use a transaction:
            // transactions are unreliable across offline/reconnect, and losing a logged person is far
            // worse than very occasionally exceeding the cap by one under simultaneous adds.
            if (config.people && config.people.length >= MAX_PEOPLE_PER_LINE) {
                alert(`Maximum number of people (${MAX_PEOPLE_PER_LINE}) reached for this line`);
                return;
            }
            const personId = newId();
            // Granular write to a UNIQUE key: never clobbers a concurrent add, and RTDB caches it
            // while offline and flushes it on reconnect.
            lineRef(lineId).child('people/' + personId).set({ name: name, ts: Date.now() }).catch(handleWriteError);

            input.value = '';
            // UI updates arrive via the Firebase listener.
        }

        function removePerson(lineId, personId) {
            if (currentRole === 'viewer') return;
            const config = lineConfigs.find(c => c.id === lineId);
            if (!config) return;
            // Granular delete of exactly this person by key — never touches other entries.
            lineRef(lineId).child('people/' + personId).remove().catch(handleWriteError);
        }

        function clearPeople(lineId) {
            if (currentRole === 'viewer') return;
            if (confirm('Are you sure you want to clear all people from this line?')) {
                lineRef(lineId).child('people').remove().catch(handleWriteError);
            }
        }

        function handlePersonInput(event, lineId) {
            if (event.key === 'Enter') {
                event.preventDefault();
                addPerson(lineId);
            }
        }

        // Wait Queue Management Functions
        function addToWaitQueue(lineId) {
            if (currentRole === 'viewer') return;
            const config = lineConfigs.find(c => c.id === lineId);
            if (!config) return;

            const input = document.getElementById(`newWaitQueuePerson${lineId}`);
            const name = input.value.trim();
            if (!name) return;

            const personId = newId();
            // Granular write: only this line's waitQueue subtree (never touches the general queue).
            lineRef(lineId).child('waitQueue/' + personId).set({ name: name, ts: Date.now() }).catch(handleWriteError);
            input.value = '';
        }

        function removeFromWaitQueue(lineId, personId) {
            if (currentRole === 'viewer') return;
            lineRef(lineId).child('waitQueue/' + personId).remove().catch(handleWriteError);
        }

        function clearWaitQueue(lineId) {
            if (currentRole === 'viewer') return;
            if (confirm('Are you sure you want to clear the entire wait queue?')) {
                lineRef(lineId).child('waitQueue').remove().catch(handleWriteError);
            }
        }

        function promoteFromWaitQueue(lineId) {
            if (currentRole === 'viewer') return;
            const config = lineConfigs.find(c => c.id === lineId);
            if (!config || !config.waitQueue || config.waitQueue.length === 0) return;

            // Move up to capacity from this line's wait queue into its people list, atomically:
            // one multi-path update rewrites only this line's people + waitQueue subtrees.
            const peopleToPromote = Math.min(config.waitQueue.length, MAX_PEOPLE_PER_LINE);
            const promoted = config.waitQueue.slice(0, peopleToPromote);
            const remaining = config.waitQueue.slice(peopleToPromote);

            const peopleObj = {};
            promoted.forEach((p, i) => { peopleObj[newId()] = { name: p.name, ts: Date.now() + i }; });
            const wqObj = {};
            remaining.forEach((p, i) => { wqObj[newId()] = { name: p.name, ts: Date.now() + i }; });

            lineRef(lineId).update({
                people: Object.keys(peopleObj).length ? peopleObj : null,
                waitQueue: Object.keys(wqObj).length ? wqObj : null
            }).catch(handleWriteError);
        }

        function handleWaitQueueInput(event, lineId) {
            if (event.key === 'Enter') {
                event.preventDefault();
                addToWaitQueue(lineId);
            }
        }

        // Add event listeners for global settings
        document.getElementById('sessionDuration').addEventListener('change', function () {
            updateTimingSettings();
            updateTimers();
        });

        document.getElementById('alarmInterval').addEventListener('change', function () {
            updateTimingSettings();
            updateTimers();
        });

        document.getElementById('finishWindow').addEventListener('change', function () {
            FINISH_WINDOW_MIN = parseInt(this.value);
            writeConfigScalars();
            updateTimers();
        });

        document.getElementById('maxPeople').addEventListener('change', function () {
            MAX_PEOPLE_PER_LINE = parseInt(this.value);
            writeConfigScalars();
            updateLineConfigs();
            updateTimers();
        });

        document.getElementById('blinkTime').addEventListener('change', function () {
            BLINK_TIME_MIN = parseInt(this.value);
            writeConfigScalars();
            updateTimers();
        });

        document.getElementById('autoReschedule').addEventListener('change', function () {
            AUTO_RESCHEDULE_MIN = this.value;
            writeConfigScalars();
        });

        // Function to get role from URL parameters
        function getRoleFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            // Only allow valid roles
            if (role && ['admin', 'dispatcher', 'viewer'].includes(role)) {
                return role;
            }
            return 'viewer'; // Default to viewer if no valid role is provided
        }

        // Function to update UI based on role
        function updateUIBasedOnRole() {
            isUpdatingUI = true;  // Set flag before UI update
            currentRole = getRoleFromUrl();
            const configSection = document.getElementById('configSection');
            const configContent = document.getElementById('configContent');
            const globalSettings = configContent.querySelector('.global-settings');
            const addLineBtn = configContent.querySelector('.add-line-btn');
            const formButtons = configContent.querySelector('.form-buttons');
            const linesContainer = document.getElementById('linesContainer');

            // Set data-role attribute for mobile styles
            if (configSection) {
                configSection.setAttribute('data-role', currentRole);
            }

            if (currentRole === 'viewer') {
                // Hide entire config section for viewers
                if (configSection) configSection.style.display = 'none';
                if (globalSettings) globalSettings.style.display = 'none';
                if (addLineBtn) addLineBtn.style.display = 'none';
                if (formButtons) formButtons.style.display = 'none';
                if (linesContainer) linesContainer.style.display = 'block';
            } else if (currentRole === 'dispatcher') {
                // Show config section but hide global settings and add line button for dispatchers
                if (configSection) configSection.style.display = 'block';
                if (globalSettings) globalSettings.style.display = 'none';
                if (addLineBtn) addLineBtn.style.display = 'none';
                if (formButtons) formButtons.style.display = 'none';
                if (linesContainer) linesContainer.style.display = 'block';
            } else {
                // Show all config elements for admin
                if (configSection) configSection.style.display = 'block';
                if (globalSettings) globalSettings.style.display = 'block';
                if (addLineBtn) addLineBtn.style.display = 'block';
                if (formButtons) formButtons.style.display = 'block';
                if (linesContainer) linesContainer.style.display = 'block';
            }

            // Update line configs to reflect new permissions
            updateLineConfigs();

            // Reset flag after a short delay to ensure all updates are complete
            setTimeout(() => {
                isUpdatingUI = false;
            }, 1000);
        }

        // Initialize UI based on role when DOM is ready
        document.addEventListener('DOMContentLoaded', function () {
            updateUIBasedOnRole();
        });

        // Firebase automatically loads state via the real-time listener above
        // No need for explicit state loading

        // Password protection
        const PASSWORD = 'speedchat2025';
        const PASSWORD_STORAGE_KEY = 'speedchat_password_verified';

        function checkPassword() {
            const input = document.getElementById('passwordInput');
            const error = document.getElementById('passwordError');
            const modal = document.getElementById('passwordModal');

            if (input.value === PASSWORD) {
                localStorage.setItem(PASSWORD_STORAGE_KEY, 'true');
                modal.classList.remove('visible');
                document.body.style.overflow = 'auto';
            } else {
                error.style.display = 'block';
                input.value = '';
            }
        }

        // Check password on page load
        window.addEventListener('load', function () {
            const isVerified = localStorage.getItem(PASSWORD_STORAGE_KEY) === 'true';
            if (!isVerified) {
                const modal = document.getElementById('passwordModal');
                modal.classList.add('visible');
                document.body.style.overflow = 'hidden';
            }
        });

        // Allow Enter key to submit password
        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // Add updateTimingSettings function
        function updateTimingSettings() {
            const sessionMinutes = parseInt(document.getElementById('sessionDuration').value);
            const alarmMinutes = parseInt(document.getElementById('alarmInterval').value);
            BLINK_TIME_MIN = parseInt(document.getElementById('blinkTime').value);
            FINISH_WINDOW_MIN = parseInt(document.getElementById('finishWindow').value);
            AUTO_RESCHEDULE_MIN = document.getElementById('autoReschedule').value;

            TOTAL_SESSION_TIME = sessionMinutes * 60 * 1000;
            MS5 = alarmMinutes * 60 * 1000;

            // Granular write of just the scalar config fields (never touches lines/queues).
            writeConfigScalars();
        }

        // Debounced write of the scalar config fields so typing/spinner clicks don't fire a write
        // per keystroke. Writes ONLY config scalars — lines, people and queues are left untouched.
        let _configWriteTimer = null;
        function writeConfigScalars() {
            if (currentRole === 'viewer' || !stateRef) return;
            if (_configWriteTimer) clearTimeout(_configWriteTimer);
            _configWriteTimer = setTimeout(() => {
                _configWriteTimer = null;
                stateRef.child('config').update(currentScalars()).catch(handleWriteError);
            }, 400);
        }

        // Full-tree writer in KEYED form. Only used for seeding/reset now — every normal mutation
        // writes a granular child path instead (see the write helpers above).
        async function saveState(stateToSave = null) {
            if (currentRole === 'viewer' || !stateRef) return;
            try {
                let state = stateToSave;
                if (!state) {
                    const linesObj = {};
                    lineConfigs.forEach((c, i) => {
                        let k = c.id;
                        if (k == null || isNumericKey(k) || String(k).startsWith('legacy-')) k = newId();
                        linesObj[k] = { name: c.name || ('Line ' + (i + 1)), time: c.time || '', order: (typeof c.order === 'number') ? c.order : i };
                        const people = toKeyedEntries(c.people);
                        if (Object.keys(people).length) linesObj[k].people = people;
                        const wq = toKeyedEntries(c.waitQueue);
                        if (Object.keys(wq).length) linesObj[k].waitQueue = wq;
                    });
                    state = { timestamp: Date.now(), config: Object.assign(currentScalars(), { lines: linesObj }) };
                    const gwq = toKeyedEntries(generalWaitQueue);
                    if (Object.keys(gwq).length) state.config.generalWaitQueue = gwq;
                }
                await stateRef.set(state);
            } catch (error) {
                console.error("Error saving state to Firebase:", error);
            }
        }

        function resetApplication() {
            if (confirm('Are you sure you want to reset all settings? This will clear all saved configurations and timers.')) {
                // Clear localStorage
                localStorage.removeItem('speedChatConfig');

                // Reset variables
                lineConfigs = [];
                scheduledTimes = {};
                TOTAL_SESSION_TIME = 30 * 60 * 1000;
                MS5 = 5 * 60 * 1000;
                FINISH_WINDOW_MIN = 5;
                MAX_PEOPLE_PER_LINE = 10;
                BLINK_TIME_MIN = 5;
                AUTO_RESCHEDULE_MIN = 'off';

                // Reset form values
                document.getElementById('sessionDuration').value = '30';
                document.getElementById('alarmInterval').value = '5';
                document.getElementById('finishWindow').value = FINISH_WINDOW_MIN;
                document.getElementById('maxPeople').value = '10';
                document.getElementById('blinkTime').value = '5';

                // Clear timers container and lines container
                document.getElementById('timers-container').innerHTML = '';
                document.getElementById('linesContainer').innerHTML = '';

                // Hide notification if visible
                document.getElementById('changeSeatNotification').style.display = 'none';
                document.getElementById('notificationOverlay').style.display = 'none';

                // Update UI
                updateLineConfigs();
                updateTimers();

                // Save state to server
                saveState();
            }
        }

        // Add event listener for the reset button
        document.querySelector('.reset-btn').addEventListener('click', function (e) {
            e.preventDefault();
            resetApplication();
        });

        // Add this after the DOMContentLoaded event listener
        document.addEventListener('DOMContentLoaded', function () {
            // Set initial toggle state from localStorage
            const alarmToggle = document.getElementById('alarmToggle');
            alarmToggle.checked = alarmsEnabled;

            // Add event listener for toggle changes
            alarmToggle.addEventListener('change', function () {
                alarmsEnabled = this.checked;
                localStorage.setItem('alarmsEnabled', alarmsEnabled);
            });
        });

        // Update the wait queue indicator on the main UI
        function updateWaitQueueIndicator() {
            const indicator = document.getElementById('waitQueueCount');
            if (indicator) {
                indicator.textContent = generalWaitQueue.length;
            }
        }

        // Render the general wait queue UI
        function renderGeneralWaitQueue() {
            const list = document.getElementById('generalWaitQueueList');
            const count = document.getElementById('generalWaitQueueCount');
            const bulkPromote = document.getElementById('bulkPromoteButtons');
            if (!list || !count || !bulkPromote) return;
            list.innerHTML = '';
            count.textContent = generalWaitQueue.length;

            // Update the main UI indicator
            updateWaitQueueIndicator();

            // Render each person
            generalWaitQueue.forEach((person, idx) => {
                const entry = document.createElement('div');
                entry.className = 'wait-queue-entry';
                entry.style.display = 'flex';
                entry.style.justifyContent = 'space-between';
                entry.style.alignItems = 'center';
                entry.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        <span class="person-order">${idx + 1}.</span>
                        <span>${person.name}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <div style="position: relative;">
                            <button type="button" style="background: #8f0057; color: white; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem;" onclick="toggleMoveDropdown('${person.id}')">Move</button>
                            <div id="moveDropdown${person.id}" style="display: none; position: absolute; right: 0; background: white; border: 1px solid #ff97d7; border-radius: 4px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1); z-index: 1000; margin-top: 0.25rem; min-width: 100px;">
                                ${lineConfigs.map(line => `
                                    <button type="button" style="display: block; width: 100%; background: none; border: none; padding: 0.5rem; text-align: left; cursor: pointer; color: #4a4949;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='none'" onclick="promotePersonToLine('${person.id}', '${line.id}'); toggleMoveDropdown('${person.id}')">${line.name}</button>
                                `).join('')}
                            </div>
                        </div>
                        <button type="button" style="color: #8f0057; font-size: 1.2rem; background: none; border: none; cursor: pointer;" onclick="removeFromGeneralWaitQueue('${person.id}')">×</button>
                    </div>
                `;
                list.appendChild(entry);
            });
            // Bulk promote buttons
            bulkPromote.innerHTML = lineConfigs.map(line => `
                <button type="button" style="background: #8f0057; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; margin-right: 0.5rem; margin-bottom: 0.25rem;" onclick="bulkPromoteToLine('${line.id}')">Promote to ${line.name}</button>
            `).join('');
        }

        function generalQueueRef() { return stateRef.child('config/generalWaitQueue'); }

        // Add person to general wait queue (granular write to a single new key)
        function addGeneralWaitQueuePerson() {
            if (currentRole === 'viewer') return;
            const input = document.getElementById('newGeneralWaitQueuePerson');
            const name = input.value.trim();
            if (!name) return;
            generalQueueRef().child(newId()).set({ name: name, ts: Date.now() }).catch(handleWriteError);
            input.value = '';
        }

        // Remove person from general wait queue (granular delete)
        function removeFromGeneralWaitQueue(personId) {
            if (currentRole === 'viewer') return;
            generalQueueRef().child(personId).remove().catch(handleWriteError);
        }

        // Clear all from general wait queue
        function clearGeneralWaitQueue() {
            if (currentRole === 'viewer') return;
            if (confirm('Are you sure you want to clear the entire wait queue?')) {
                generalQueueRef().remove().catch(handleWriteError);
            }
        }

        // Promote a single person from the general queue to a line.
        // Transaction on the line's people enforces capacity under concurrency; the queue entry is
        // removed only if the add actually committed (so the person is never lost).
        function promotePersonToLine(personId, lineId) {
            if (currentRole === 'viewer') return;
            const person = generalWaitQueue.find(p => p.id === personId);
            const line = lineConfigs.find(l => l.id === lineId);
            if (!person || !line) return;
            if ((line.people || []).length >= MAX_PEOPLE_PER_LINE) {
                alert(`Line ${line.name} is already full.`);
                return;
            }
            // Move atomically in one multi-path update: add to the line's people (unique key) and
            // remove from the general queue. Never clobbers, offline-safe.
            const updates = {};
            updates['config/lines/' + lineId + '/people/' + newId()] = { name: person.name, ts: Date.now() };
            updates['config/generalWaitQueue/' + personId] = null;
            stateRef.update(updates).catch(handleWriteError);
        }

        // Bulk promote from the general queue to a line (fill up to capacity).
        function bulkPromoteToLine(lineId) {
            if (currentRole === 'viewer') return;
            const line = lineConfigs.find(l => l.id === lineId);
            if (!line) return;
            const currentCount = (line.people || []).length;
            const available = MAX_PEOPLE_PER_LINE - currentCount;
            if (available <= 0) { alert(`Line ${line.name} is already full.`); return; }
            const toPromote = generalWaitQueue.slice(0, available);
            if (!toPromote.length) return;
            const updates = {};
            toPromote.forEach((p, i) => {
                updates['config/lines/' + lineId + '/people/' + newId()] = { name: p.name, ts: Date.now() + i };
                updates['config/generalWaitQueue/' + p.id] = null; // remove from queue in same atomic update
            });
            stateRef.update(updates).catch(handleWriteError);
        }

        // Hook up event listeners
        setTimeout(() => {
            const addBtn = document.getElementById('addGeneralWaitQueuePersonBtn');
            const clearBtn = document.getElementById('clearGeneralWaitQueueBtn');
            const input = document.getElementById('newGeneralWaitQueuePerson');

            if (addBtn) addBtn.onclick = addGeneralWaitQueuePerson;
            if (clearBtn) clearBtn.onclick = clearGeneralWaitQueue;
            if (input) {
                input.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') addGeneralWaitQueuePerson();
                });
            }
            renderGeneralWaitQueue();
        }, 500);

        // Re-render wait queue on state update
        const oldUpdateUIFromState = updateUIFromState;
        updateUIFromState = function (config) {
            oldUpdateUIFromState(config);
            renderGeneralWaitQueue();
        };

        // Toggle move dropdown for a specific person
        function toggleMoveDropdown(personId) {
            const dropdown = document.getElementById(`moveDropdown${personId}`);
            if (dropdown) {
                // Close all other dropdowns first
                document.querySelectorAll('[id^="moveDropdown"]').forEach(d => {
                    if (d.id !== `moveDropdown${personId}`) {
                        d.style.display = 'none';
                    }
                });

                // Toggle current dropdown
                dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
            }
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', function (event) {
            if (!event.target.closest('[id^="moveDropdown"]') && !event.target.closest('button[onclick*="toggleMoveDropdown"]')) {
                document.querySelectorAll('[id^="moveDropdown"]').forEach(d => {
                    d.style.display = 'none';
                });
            }
        });

        // Update current time display
        function updateCurrentTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit'
            });
            const timeElement = document.getElementById('currentTime');
            if (timeElement) {
                timeElement.textContent = timeString;
            }
        }

        // Initialize and update current time
        updateCurrentTime();
        setInterval(updateCurrentTime, 1000);

        // Helper to get the next 5-minute slot after a given interval
        function getNextFiveMinuteSlot(baseTime, intervalMinutes) {
            const d = new Date(baseTime + intervalMinutes * 60 * 1000);
            d.setSeconds(0, 0);
            const minutes = d.getMinutes();
            const next5 = Math.ceil(minutes / 5) * 5;
            if (next5 === 60) {
                d.setHours(d.getHours() + 1);
                d.setMinutes(0);
            } else {
                d.setMinutes(next5);
            }
            return d.getTime();
        }

        // Function to update next line information
        function updateNextLineInfo() {
            const nextLineInfoElement = document.getElementById('nextLineInfo');
            if (!nextLineInfoElement) return;

            const now = Date.now();
            let nextLineToStart = null;
            let nextLineToFinish = null;
            let minTimeToStart = Infinity;
            let minTimeToFinish = Infinity;

            // Find the line that will start next and the line that will finish next
            lineConfigs.forEach(config => {
                if (config.time && scheduledTimes[config.id]) {
                    const startTime = scheduledTimes[config.id];
                    const endTime = startTime + TOTAL_SESSION_TIME;

                    // Check if this line hasn't started yet
                    if (startTime > now) {
                        const timeToStart = startTime - now;
                        if (timeToStart < minTimeToStart) {
                            minTimeToStart = timeToStart;
                            nextLineToStart = config;
                        }
                    }

                    // Check if this line is currently running and will finish soon
                    if (startTime <= now && endTime > now) {
                        const timeToFinish = endTime - now;
                        if (timeToFinish < minTimeToFinish) {
                            minTimeToFinish = timeToFinish;
                            nextLineToFinish = config;
                        }
                    }
                }
            });

            // Display the appropriate information
            if (nextLineToStart && minTimeToStart !== Infinity) {
                const minutesToStart = Math.floor(minTimeToStart / 60000);
                const displayMinutes = minutesToStart < 1 ? "< 1" : minutesToStart;
                nextLineInfoElement.textContent = `Next: ${nextLineToStart.name} starts in ${displayMinutes} min`;
            } else if (nextLineToFinish && minTimeToFinish !== Infinity) {
                const minutesToFinish = Math.floor(minTimeToFinish / 60000);
                const displayMinutes = minutesToFinish < 1 ? "< 1" : minutesToFinish;
                nextLineInfoElement.textContent = `${nextLineToFinish.name} finishes in ${displayMinutes} min`;
            } else {
                // Check if any lines are scheduled for later today
                const futureLines = lineConfigs.filter(config =>
                    config.time && scheduledTimes[config.id] && scheduledTimes[config.id] > now
                );

                if (futureLines.length > 0) {
                    // Find the earliest future line
                    const earliestFutureLine = futureLines.reduce((earliest, current) => {
                        return scheduledTimes[current.id] < scheduledTimes[earliest.id] ? current : earliest;
                    });
                    const timeToStart = scheduledTimes[earliestFutureLine.id] - now;
                    const minutesToStart = Math.floor(timeToStart / 60000);
                    const displayMinutes = minutesToStart < 1 ? "< 1" : minutesToStart;
                    nextLineInfoElement.textContent = `Next: ${earliestFutureLine.name} starts in ${displayMinutes} min`;
                } else {
                    nextLineInfoElement.textContent = "No lines scheduled";
                }
            }
        }

        // Update next line information every 30 seconds
        setInterval(updateNextLineInfo, 30000);

        // Initial update
        setTimeout(updateNextLineInfo, 1000);
    </script>
